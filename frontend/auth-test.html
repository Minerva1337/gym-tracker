<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GymTracker – Login & Registrierung</title>
</head>
<body>
  <h1>👤 Auth Demo</h1>

  <h2>🔐 Registrierung</h2>
  <form id="registerForm">
    <input type="text" id="reg_username" placeholder="Benutzername" required><br>
    <input type="email" id="reg_email" placeholder="E-Mail" required><br>
    <input type="password" id="reg_password" placeholder="Passwort" required><br>
    <button type="submit">Registrieren</button>
  </form>

  <h2>🔑 Login</h2>
  <form id="loginForm">
    <input type="email" id="login_email" placeholder="E-Mail" required><br>
    <input type="password" id="login_password" placeholder="Passwort" required><br>
    <button type="submit">Login</button>
  </form>

  <h3>📦 Token:</h3>
  <pre id="tokenOutput">Noch kein Token</pre>

  <script>
    const BASE_URL = 'http://localhost:3000'; // Passe an, falls du andere Port/Domain nutzt

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${BASE_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('reg_username').value,
          email: document.getElementById('reg_email').value,
          password: document.getElementById('reg_password').value
        })
      });
      const data = await res.json();
      alert(data.message || 'Registrierung abgeschlossen');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login_email').value,
          password: document.getElementById('login_password').value
        })
      });

      const data = await res.json();
      if (data.access_token) {
        localStorage.setItem('jwt', data.access_token);
        document.getElementById('tokenOutput').innerText = data.access_token;
        alert('Login erfolgreich!');
      } else {
        alert('Login fehlgeschlagen: ' + JSON.stringify(data));
      }
    });
  </script>
</body>
</html>
